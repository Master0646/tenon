schema_version: 2
tasks:
  - id: T1
    title: 冻结第二轮协议与执行条件
    depends_on: []
    acceptance:
      - id: T1-A1
        text: 协议记录固定 CLI、三类场景、两种格式、模型通道、硬预算和评分规则，未满足执行条件不启动真实运行
        method: manual
  - id: T2
    title: 实现隔离夹具与独立评分器
    depends_on: ["T1"]
    acceptance:
      - id: T2-A1
        text: 离线测试覆盖三类故障、合法恢复、伪造完成和缺失轨迹；不伪造人工批准或确认
        method: manual
  - id: T3
    title: 执行三十次真实对照并记录证据
    depends_on: ["T2"]
    acceptance:
      - id: T3-A1
        text: 每类每组五次真实运行，完整记录输入哈希、答复、工具轨迹、限制与 unknown；由人核对样本清单
        method: manual
  - id: T4
    title: 生成结果报告及后续建议
    depends_on: ["T3"]
    acceptance:
      - id: T4-A1
        text: 报告可从原始记录重算，包含全部分母、安全指标、效率分布和局限，结论遵守冻结判据
        method: manual
