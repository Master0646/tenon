schema_version: 1
tasks:
  - id: T1
    title: 编译到 dist 与 package.json 发行配置
    acceptance:
      - pnpm build 生成 dist/cli.js，node dist/cli.js help 正常输出
      - package.json 的 bin 指向 ./dist/cli.js，files 只包含 dist、templates、vendor、README.md、THIRD_PARTY_LICENSES.md
      - dist/ 已加入 .gitignore
  - id: T2
    title: devflow --version
    depends_on: [T1]
    acceptance:
      - devflow --version 输出 package.json 中的版本号
      - 单元测试覆盖
  - id: T3
    title: devflow doctor
    depends_on: [T1]
    acceptance:
      - 单元测试覆盖：全部正常时退出码 0；hook 缺失、hook 指向不存在的路径、Agent 技能文件被改动、未声明验证命令各给出对应提示
      - 在 Git 仓库之外运行时只检查环境项，不报未捕获异常
      - 有 error 时退出码为 1，只有 warn 时为 0
  - id: T4
    title: README 与第三方许可证清单
    acceptance:
      - README.md 包含安装、快速开始、命令表、人与 Agent 分工、安全模型与已知限制
      - THIRD_PARTY_LICENSES.md 列出 yaml、answer-me-with-html、Bangers 字体及各自许可证
  - id: T5
    title: 安装冒烟测试脚本
    depends_on: [T1, T2, T3]
    acceptance:
      - scripts/smoke-install.sh 在本机运行通过：打包、安装到临时目录、在临时仓库中 init / doctor / new / validate / render / status 全部退出码 0
