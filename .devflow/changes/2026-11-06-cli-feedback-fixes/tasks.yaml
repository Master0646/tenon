schema_version: 1
tasks:
  - id: T1
    title: approve 未批准与成功提示
    acceptance:
      - 测试：输入非 y 时输出含"未批准"与当前状态，退出码 1，events.jsonl 不变
      - 测试：输入 y 时输出含 devflow-apply 下一步提示
  - id: T2
    title: init 按检测安装 Agent
    acceptance:
      - 测试：只有 CLAUDE.md 时 init 不生成 .agents/ 与 AGENTS.md
      - 测试：空项目 init 生成两套文件并输出 --agents 提示
      - 测试：--agents codex 只生成 Codex 文件
  - id: T3
    title: 审查页展示验证命令
    acceptance:
      - 测试：buildDraft 的草稿中含每条 verify 的 name、run、cwd
      - 测试：verify 为空时草稿含"未声明验证命令"
  - id: T4
    title: status --all 列出已归档变更
    acceptance:
      - 测试：一个进行中、两个已归档时输出三行，已归档行带 archived 与时间
      - 测试：不带 --all 时输出与现在一致
  - id: T5
    title: validate 检查审查页规则与图语法
    acceptance:
      - 测试：design.md 中 Mermaid 写法的 er 图，validate 报 error，位置为 design.md 对应行，退出码 1
      - 测试：proposal.md 中带属性的代码块，validate 报 error
      - 测试：合法的 flow、er 图 validate 通过，render 成功
      - render 与 validate 共用 runAm
  - id: T6
    title: 空知识页提醒
    acceptance:
      - 测试：无知识页时 wiki lint 输出 warn，退出码 0
      - 测试：无知识页时 doctor 报 warn
      - 测试：无知识页时 check 不输出该提示
  - id: T7
    title: 技能、手册、README 同步
    depends_on: [T1, T2, T3, T4, T5, T6]
    acceptance:
      - propose 技能写明 validate 会检查图语法，devflow update 后 .claude/、.agents/ 副本一致（doctor 无 Agent 文件 warn）
      - 手册与 README 描述 init 默认行为、status --all、validate 图语法检查、wiki lint 空页提示
      - npm test 与 typecheck 通过
