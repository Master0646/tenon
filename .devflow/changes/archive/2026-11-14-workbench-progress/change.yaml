schema_version: 2
min_cli_version: 0.2.0
title: 审查台显示工作节点与已归档变更，刷新前先提示
affected_paths:
  - src/review.ts
  - src/status.ts
  - src/render.ts
  - test/**
  - README.md
  - docs/使用手册.md
summary:
  - 首页「轮到你」一列改为「工作节点」，共 9 个节点；轮到人做的节点高亮，其余显示 Agent 正在做什么
  - 首页下方加「已归档」列表（最新的在前），点进去是只读页，没有任何操作按钮
  - 首页和变更页不再每 5 秒整页刷新：后台每 5 秒查一次状态，有变化时只显示「有新进展，点此刷新」
  - 刷新后（包括批准、确认之后的自动刷新）恢复滚动位置和展开的面板
  - 有没发送的批注或对话框开着时，提示照样出现，但不会刷新页面
  - 命令行 `devflow status` 的输出不变
decisions:
  - question: 已归档变更的只读页显示什么？
    options: [方案原文（提案、规范增量、设计、任务）、拍板结论和事件时间线, 只显示方案要点和拍板结论]
    recommend: 方案原文（提案、规范增量、设计、任务）、拍板结论和事件时间线
  - question: 首页的「状态」列还要不要？
    options: [去掉，工作节点已经包含状态, 保留，放在工作节点右边]
    recommend: 去掉，工作节点已经包含状态
