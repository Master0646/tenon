schema_version: 2
min_cli_version: 0.2.0
title: 审查台变更页重排：左侧目录、顶部操作栏、首屏只放进展与待办、显示批注记录
affected_paths:
  - src/review.ts
  - src/render.ts
  - src/feedback.ts
  - test/**
  - README.md
  - docs/使用手册.md
summary:
  - 左侧固定目录：列出所有面板和面板状态（如「与上次批准相同」「缺证据 2」），点击直接跳到该面板并展开，当前所在面板高亮
  - 操作栏从页面底部移到顶部并固定，滚动时始终可见；栏里有工作节点、要你做的操作、批注发送和 Agent 等待状态
  - 首屏只放三样：现在到哪一步（5 段进度条加当前工作节点）、要你做什么、待拍板事项
  - 方案要点和影响范围移出首屏，放到紧接着的独立面板
  - 页面底部新增「批注记录」面板，列出这个变更发过的全部批注，标明 Agent 是否已读
  - 目录、顶部操作栏、批注记录只在审查台出现；首屏内容的调整也会作用到离线审查页
  - 依赖 `2026-11-14-workbench-progress` 的工作节点，在它归档之后再开工；两者都改 review-workbench 规范，现在批准的话，它归档后本变更需要重新批准一次
decisions:
  - question: 方案要点放在哪里？
    options: [紧接首屏的独立面板，默认展开, 留在首屏、待拍板事项下面]
    recommend: 紧接首屏的独立面板，默认展开
  - question: 窄屏（宽度小于 1024px）时目录怎么放？
    options: [收成操作栏下方一行可横向滚动的标签, 隐藏目录]
    recommend: 收成操作栏下方一行可横向滚动的标签
